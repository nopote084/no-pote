<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - No Pote</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: #f4f4f4; padding: 20px; font-family: 'Nunito', sans-serif; }
    .admin-container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    .admin-container h1 { color: #c9090d; text-align: center; margin-bottom: 20px; }
    .field-block { background: #fff8e9; padding: 15px; border-radius: 12px; margin-bottom: 20px; }
    .field-block h3 { margin-top: 0; color: #c9090d; }
    input, select { margin-bottom: 10px; width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .btn-red { background: #c9090d; color: white; }
    .btn-gray { background: #ddd; color: #333; }
    .product-item { display: flex; justify-content: space-between; align-items: center; background: #fff; border: 1px solid #ddd; padding: 10px; border-radius: 8px; margin-bottom: 8px; }
  </style>
</head>
<body>

  <div class="admin-container">
    <h1>Painel de Administração</h1>
    
    <div class="field-block">
      <h3>Novo Produto</h3>
      <input type="text" id="adminName" placeholder="Nome (ex: Mini Frango)">
      <input type="number" id="adminPrice" placeholder="Preço (ex: 5.00)" step="0.01">
      <input type="text" id="adminDesc" placeholder="Descrição">
      <input type="text" id="adminImg" placeholder="Caminho da imagem (ex: assets/foto.jpeg)">
      <select id="adminCat">
        <option value="mini">Categoria: Mini</option>
        <option value="regular">Categoria: Regular</option>
      </select>
      <button class="btn-red" id="btnSaveProduct">Salvar Produto</button>

      <div style="margin-top: 15px; border-top: 1px solid #ddd; padding-top: 15px;">
        <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: bold; color: #c9090d;">
          <input type="checkbox" id="adminToggleSaoGoncalo" style="width: 20px; height: 20px; accent-color: #c9090d; margin: 0;">
          Estou saindo de São Gonçalo (Rua Goiás)
        </label>
        <small style="color: #786e68; display: block; margin-top: 5px;">Se desmarcado, o cálculo de frete sairá de Potengi.</small>
      </div>
    </div>

    <div style="margin-top: 20px;">
      <h3 style="color: #c9090d;">Produtos Cadastrados</h3>
      <div id="adminProductList"></div>
    </div>

    <div style="margin-top: 20px; display: flex; flex-direction: column; gap: 10px;">
      <button class="btn-gray" id="btnExportData">Gerar Código para o GitHub</button>
      <button class="btn-gray" onclick="window.location.href='index.html'">Voltar ao Site</button>
    </div>
  </div>

  <!-- Importando o script original para reaproveitar as funções -->
  <script src="script.js"></script>
  
  <!-- Lógica específica da página admin -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
        // Como o script.js já roda, as variáveis globais estão disponíveis
        // Precisamos apenas re-vincular os eventos aos botões desta página
        
        const btnSaveProduct = document.getElementById("btnSaveProduct");
        if(btnSaveProduct) {
            btnSaveProduct.addEventListener("click", () => {
                const name = document.getElementById("adminName").value;
                const price = parseFloat(document.getElementById("adminPrice").value);
                const desc = document.getElementById("adminDesc").value;
                const img = document.getElementById("adminImg").value;
                const cat = document.getElementById("adminCat").value;

                if(!name || !price || !img) return alert("Preencha nome, preço e imagem.");

                const newProduct = {
                    id: "prod-" + Date.now(),
                    name: name,
                    size: cat === 'mini' ? '140ml' : '350ml',
                    price: price,
                    description: desc,
                    image: img,
                    category: cat
                };

                PRODUCTS.push(newProduct);
                saveProducts(); // Função do script.js
                renderAdminList(); // Função do script.js
                alert("Produto adicionado!");
                
                document.getElementById("adminName").value = "";
                document.getElementById("adminPrice").value = "";
                document.getElementById("adminDesc").value = "";
                document.getElementById("adminImg").value = "";
            });
        }

        const toggleSaoGoncalo = document.getElementById("adminToggleSaoGoncalo");
        if(toggleSaoGoncalo) {
            toggleSaoGoncalo.addEventListener("change", (e) => {
                isSaoGoncalo = e.target.checked;
                saveConfig();
                alert(isSaoGoncalo ? "Endereço alterado para São Gonçalo" : "Endereço alterado para Potengi");
            });
        }

        const btnExportData = document.getElementById("btnExportData");
        if(btnExportData) {
            btnExportData.addEventListener("click", () => {
                const dataStr = JSON.stringify(PRODUCTS, null, 4);
                navigator.clipboard.writeText(dataStr).then(() => {
                    alert("Código copiado! Cole no GitHub.");
                });
            });
        }

        // Renderiza a lista inicial
        renderAdminList();
    });
  </script>
</body>
</html>
